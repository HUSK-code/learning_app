spring:
  application:
    name: learning-app
  
  datasource:
    url: jdbc:postgresql://db:5432/learning_platform

  username: dev_user
  password: dev_password

  # 接続プールの設定
  hikari:
    maximum-pool-size: 10
    minimum-idle: 5
    connection-timeout: 30000
    idle-timeout: 600000
    max-lifetime: 1800000

# JPAの設定
  jpa:
    # データベースプラットフォームの指定
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    
    # Hibernateの詳細設定
    hibernate:
      ddl-auto: none
      naming:
        physical-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
        implicit-strategy: org.springframework.boot.org.jpa.hibernate.SpringImplicitNamingStrategy

    show-sql: true

    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        jdbc.batch_size: 20
        order_inserts: true
        order_updates: true

# データンベースマイグレーション
flyway:
  enabled: true
  locations: classpath:db/migration
  baseline-on-migrate: true
  placeholder-replacement: false

# ロギング設定
logging:
  level:
    root: INFO
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG
    org.hibernate:SQL: DEBUG
    org.hibernate.type.description.sql.BasicBinder: TRACE
    com.example.learningapp: DEBUG

  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

server:
  port: 8080
  error:
    include-stacktrace: always
    include-message: always

application:
  jwt:
    secret: 
    expiration: 360000