services:
  db:
    image: postgres:16-alpine
    container_name: learning-app-db
    environment:
      POSTGRES_DB: learning_app
      POSTGRES_USER: dev_user
      POSTGRES_PASSWORD: dev_password
      TZ: Asia/Tokyo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev_user -d learning_app"]
      interval: 30s   # 30秒間隔でチェック
      timeout: 10s    # 10秒間隔でチェック
      retries: 5      # 5回連続で失敗したら、unhealthyと判断
      start_period: 40s    # コンテナ起動後、最初のチェックまで40秒待つ

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: learning_app_backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/learning_app
      SPRING_DATASOURCE_USERNAME: dev_user
      SPRING_DATASOURCE_PASSWORD: dev_password
      SPRING_PROFILES_ACTIVE: dev
    ports:
      - "8080:8080"
    volumes:
      - ./backend/src:/app/src
      - maven-cache:/root/.m2

volumes:
  postgres_data:
  maven-cache: